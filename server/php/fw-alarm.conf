; PHP-FPM-Pool für das FW-Alarm-Dashboard.
; Installiert von server/setup.sh nach /etc/php/8.3/fpm/pool.d/fw-alarm.conf.
; Der Standard-Pool "www" wird abgeschaltet (www.conf.disabled).

[global]
; "systemctl reload php8.3-fpm" (macht server/deploy.sh) lässt laufende
; Anfragen bis zu 40 s ausreden, statt sie sofort abzubrechen (Standard 0) -
; ein gerade laufender "Alarm an alle" (ungünstigster Fall ca. 31 s) darf
; durch ein Deploy nicht mittendrin enden.
process_control_timeout = 40s

[fw-alarm]
user = fwalarm
group = fwalarm

listen = /run/php/fw-alarm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Wenig Verkehr (Box alle 10 s, ein paar Menschen): Prozesse nur bei Bedarf.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s

; Über dem Nginx-Limit (130 s) und über set_time_limit(120) des Alarm-Versands.
request_terminate_timeout = 180s

; Eigener Sitzungsordner: Ubuntus Aufräum-Cron (/usr/lib/php/sessionclean)
; kennt nur den Ordner aus der php.ini und löscht dort nach 24 min - damit
; endete das 12-h-Login. Hier räumt PHP selbst auf (1 % der Anfragen).
php_admin_value[session.save_path] = /srv/fw-alarm/sessions
php_value[session.gc_maxlifetime] = 43200
php_value[session.gc_probability] = 1
php_value[session.gc_divisor] = 100

php_admin_value[error_log] = /var/log/fw-alarm/php.log
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
