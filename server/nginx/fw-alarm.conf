# FW-Alarm-Dashboard auf der Oracle-VM.
# Installiert von server/setup.sh nach /etc/nginx/sites-available/fw-alarm.
#
# Nginx hört NUR auf 127.0.0.1:8080 - der einzige Weg von außen ist der
# Cloudflare Tunnel (cloudflared → http://127.0.0.1:8080).

# Zugriffsprotokoll: bewusst nur Methode + Pfad ($uri), NIE $request oder
# $args - in der Query der Kurzbefehl-Links (api/mute.php?t=…) steht das
# Geheim-Token. "bridge=1" kennzeichnet Aufrufe, die über die NAS-Brücke
# kamen (Kopfzeile X-FW-Bridge) - so sieht man nach dem Flashen, ob die Box
# noch über das NAS läuft.
log_format fwalarm '$time_iso8601 "$request_method $uri" $status $body_bytes_sent '
                   'rt=$request_time bridge=$http_x_fw_bridge "$http_user_agent"';

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /srv/fw-alarm/app;
    index index.php;

    server_tokens off;
    client_max_body_size 64k;

    access_log /var/log/nginx/fw-alarm.access.log fwalarm;
    # Hinweis: Das Fehlerprotokoll von Nginx nennt bei einem Fehler die ganze
    # Anfragezeile (mit Query). Es ist nur für root/adm lesbar und bekommt
    # nur echte Fehler (PHP-Meldungen gehen in /var/log/fw-alarm/php.log).
    error_log /var/log/nginx/fw-alarm.error.log error;

    # Nie ausliefern: Konfiguration, Vorlagen, Bibliotheken, Cron, Daten.
    # (Die Regex-Regel muss VOR der PHP-Regel stehen; ^~ schlägt jede Regex.)
    location ~ ^/(config\.php|config\.example\.php|SETUP\.md)$ { return 404; }
    location ^~ /data/ { return 404; }
    location ^~ /lib/  { return 404; }
    location ^~ /cron/ { return 404; }
    location ~ /\.     { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/fw-alarm.sock;
        # Der ungünstigste "Alarm an alle" dauert ca. 31 s (3 Versuche à
        # 10 s); PHP begrenzt ihn selbst auf 120 s. Cloudflare bricht nach
        # 100 s ab.
        fastcgi_read_timeout 130s;
    }
}
