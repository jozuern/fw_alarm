; ============================================================================
;  PlatformIO-Projektdatei für den BOSS-925 Alarm-Wächter (ESP32)
;  ----------------------------------------------------------------------------
;  Bauen/Flashen per CLI:
;     pio run                 -> kompilieren
;     pio run -t upload       -> auf den ESP32 flashen
;     pio device monitor      -> serielle Ausgabe ansehen (115200 Baud)
;
;  src_dir zeigt auf den Sketch-Ordner, dessen Name exakt der .ino entspricht,
;  damit das Projekt ZUSÄTZLICH direkt in der Arduino IDE geöffnet werden kann.
; ============================================================================
[platformio]
src_dir = boss925_alarm_bark

[env:esp32dev]
; Plattform-Version fest eingetragen: Ein "pio run" auf einem anderen Rechner
; (oder nach einem Plattform-Update) baut so garantiert mit demselben
; Arduino-ESP32-Core 2.0.17, mit dem die Firmware getestet ist - statt still
; einen neueren Core mit anderem Verhalten zu ziehen.
platform  = espressif32@7.0.1
board     = esp32dev
framework  = arduino
monitor_speed = 115200
upload_speed  = 921600

; Keine externen Libraries nötig - alles steckt im ESP32-Arduino-Core
; (WiFi, HTTPClient, WiFiClientSecure, time.h, esp_task_wdt, esp_timer,
; esp_system, Preferences).
lib_deps =
